name: "PR build, scan, and E2E"

# Every PR that changes the image: build -> {Grype scan, Playwright e2e} in parallel. With the
# `deploy-feature` label the image that passed e2e is also promoted, deploy/ is rendered into a
# signed manifest artifact pinned to it, and an ephemeral preview env is deployed to the homelab cluster via GitOps (the per-PR overlay under
# clusters/production/apps/previews/pbs-browser in hwinther/proxmox; Flux reconciles within ~1 min).
#
# On same-repo PRs the build pushes a staging tag (pr-<N>-<sha7>) and hands on repo@digest, so the
# scan, e2e and the push all use the same bytes; Dependabot PRs fall back to a workflow artifact.
# prune-ghcr.yml deletes staging tags once the PR is closed, and pr-preview-cleanup.yml removes the
# preview.
#
# The e2e stack runs the image with PBS_FAKE=1 (sample data, no PBS). The preview runs the REAL
# client against PBS and is Authelia-gated. Requires repo secrets PROXMOX_GITOPS_APP_ID +
# PROXMOX_GITOPS_APP_PRIVATE_KEY (the GitHub App that can commit to hwinther/proxmox).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.e2e.yml"
      # A PR labelled deploy-feature previews its manifest changes.
      - "deploy/**"
      - ".github/workflows/pr-e2e.yml"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # linux/amd64 only: the runner arch, which proxmox-backup-client-static requires.
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: app
      build_context: .
      dockerfile: Dockerfile

  # Runs next to e2e rather than before it. auto = report/SARIF/comment only on PRs.
  scan:
    needs: [build]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      image: ${{ needs.build.outputs.image }}
      container_image_name_postfix: app
      grype_fail_build: auto

  # Playwright drives the image from docker-compose.e2e.yml; APP_IMAGE is set to the hand-off
  # before `docker compose up`.
  e2e:
    needs: [build]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      compose_file: docker-compose.e2e.yml
      playwright_working_directory: e2e
      playwright_cache_enabled: true
      node_modules_cache_enabled: true
      # setup-node's registry-url defaults to GitHub Packages, which would repoint the GLOBAL npm
      # registry and break `npm ci` of the public deps. Pin it back to public npm.
      npm_registry_url: https://registry.npmjs.org
      playwright_env: |
        BASE_URL=http://localhost:8080
      image_artifacts_json: |
        {"APP_IMAGE":"${{ needs.build.outputs.image }}"}

  push:
    needs: [build, scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: app
      artifact_name: ${{ needs.build.outputs.image }}
      container_image_tags: ${{ needs.build.outputs.container_image_tags }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      version: ${{ needs.build.outputs.version }}
      sbom_artifact_name: ${{ needs.scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.scan.outputs.grype_json_sha256 }}

  # The preview deploys from a rendered, signed manifest artifact (this PR's deploy/), so manifest
  # changes in a PR run in its preview before they reach a release. The cluster repo's preview
  # template pins it by digest and only accepts this workflow's signature.
  manifests:
    needs: [build, push]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: pr-${{ github.event.pull_request.number }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate, push and sign
        id: push
        uses: hwinther/reusable-workflows/.github/actions/manifests@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
        with:
          mode: push
          artifact: ghcr.io/hwinther/pbs-browser/manifests
          tag: pr-${{ github.event.pull_request.number }}
          images: ghcr.io/hwinther/pbs-browser/app:${{ needs.build.outputs.version }}@${{ needs.push.outputs.image_digest }}
          renders: pbs-browser.yaml=deploy

  deploy-preview:
    needs: [manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-upsert.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/pbs-browser
      pr_number: ${{ github.event.pull_request.number }}
      host: pbs-browser-${{ github.event.pull_request.number }}.preview.wsh.no
      app_name: pbs-browser
      # The preview template pins the manifest artifact (which pins the image), not the image.
      image_tag: ${{ needs.manifests.outputs.tag }}
      image_digest: ${{ needs.manifests.outputs.digest }}
    secrets:
      app_id: ${{ secrets.PROXMOX_GITOPS_APP_ID }}
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  comment:
    needs: [deploy-preview, manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview-URL sticky comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pbs-browser-preview-env
          message: |
            ### Preview environment

            Deployed via Flux (reconciles within ~1 min) after the image passed Playwright e2e
            (which runs it with `PBS_FAKE=1`), from the signed manifest artifact
            `manifests:${{ needs.manifests.outputs.tag }}` (this PR's `deploy/`). The preview runs the same image with the **real**
            proxmox-backup-client against PBS, so it can browse and restore real backups; it is
            Authelia-gated.

            - Preview URL: ${{ needs.deploy-preview.outputs.preview_url }}

            Closing the PR removes the env via `pr-preview-cleanup.yml`.
