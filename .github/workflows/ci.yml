name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  pr-build:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@3d2710f9d075c767c77d3e7fe78af4fbb298e10b # v2.26.2
    with:
      node_enabled: true
      node_version: "26.x"
      node_working_directory: "frontend"
      node_changes_regex: "frontend/.*"
      dotnet_enabled: true
      dotnet_version: "10.0.x"
      dotnet_working_directory: "backend"
      dotnet_solution_file: "PbsBrowser.slnx"
