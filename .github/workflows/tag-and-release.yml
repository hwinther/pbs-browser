name: "Create tag and release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.2.3), or 'auto' for the next GitVersion"
        required: false
        default: "auto"
      release_notes:
        description: "Release notes for this tag"
        required: false
      create_release:
        description: "Create a GitHub Release for this tag"
        type: boolean
        default: true
      container_grype_fail_build:
        description: "Fail the container workflow if Grype finds vulnerabilities (turn off for a release override)"
        type: boolean
        default: true

jobs:
  tag:
    # Required so we can dispatch the container workflow after tagging (a tag push made with
    # GITHUB_TOKEN does not fire on.push.tags).
    permissions:
      contents: write
      actions: write
    uses: hwinther/reusable-workflows/.github/workflows/tag-and-release.yml@d64e1f7f0851a36a96deda55907a93468a601107 # v2.9.2
    with:
      tag_name: ${{ inputs.tag_name }}
      release_notes: ${{ inputs.release_notes }}
      create_release: ${{ inputs.create_release }}

  trigger-container-build:
    needs: tag
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The tag comes from the reusable job's output, the tag it just created. Guessing it with
      # `git fetch --tags` + the highest v* tag needed a checkout, and could pick a different tag
      # than the one just made. No checkout is needed at all.
      - name: Dispatch container workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag_name }}
          GRYPE_FAIL_BUILD: ${{ inputs.container_grype_fail_build }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::The tag job reported no tag name."
            exit 1
          fi
          echo "Dispatching container.yml at $TAG"
          gh workflow run container.yml -R "$REPO" --ref "$TAG" -f grype_fail_build="$GRYPE_FAIL_BUILD"
